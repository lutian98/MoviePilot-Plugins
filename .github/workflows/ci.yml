name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法编译检查
        run: python -m compileall -q plugins.v3

      - name: 索引与插件版本一致性
        run: python .github/scripts/check_plugin_versions.py

      - name: 空白符检查
        run: git diff --check

      - name: 单元测试（含端到端沙箱）
        run: python -m unittest discover -s tests/v3 -t . -v
